name: Server

# The control plane (Next.js + PostgreSQL, ADR-0001). The integration tests call
# route handlers directly against a real database (#541, #552).
#
# Contract tests read the agent's schema/updater fixtures, the ML common-set golden
# and the shipped IOC feeds: the job checks the public repos out side by side (server/ +
# agent/ + ml/ + rules/) and sets SYNTHAEA_REQUIRE_SIBLINGS so none of them can silently skip.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: server-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: server
    env:
      SYNTHAEA_ROOT: ${{ github.workspace }}
      SYNTHAEA_REQUIRE_SIBLINGS: "1"
      # `docker-compose.test.yml`'s database and credentials, on the same port,
      # so the suites see exactly what they see locally (tests/setup.ts default).
      DATABASE_URL: postgresql://synthaea:synthaea_test@localhost:5433/synthaea_test
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: synthaea_test
          POSTGRES_USER: synthaea
          POSTGRES_PASSWORD: synthaea_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U synthaea"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: server
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: synthaea-lab/agent
          path: agent
          persist-credentials: false
          # Everything the agent publishes for other repos to test against.
          sparse-checkout: |
            /apps/agent/src/sink/mod.rs
            /crates/*/tests/fixtures/
            /crates/*/data/
          sparse-checkout-cone-mode: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: synthaea-lab/ml
          path: ml
          persist-credentials: false
          sparse-checkout: tests/fixtures
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: synthaea-lab/rules
          path: rules
          persist-credentials: false
      # Node 20: what server/Dockerfile ships.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: install
        run: npm ci
      - name: prisma client
        run: npx prisma generate
      # After `prisma generate`: both read the generated client's types.
      - name: type check
        run: npm run typecheck
      - name: lint
        run: npm run lint
      # `db push`, not `migrate`: server/.gitignore excludes prisma/migrations, so
      # there are none to apply. A fresh database each run makes data loss moot.
      - name: create the schema
        run: npx prisma db push --skip-generate --accept-data-loss
      - name: unit tests
        run: npx vitest run tests/unit
      # One file at a time (`fileParallelism: false` in vitest.config.ts, #541):
      # every integration file clears the same database.
      - name: integration tests (PostgreSQL)
        run: npm run test:integration

  # Unit suites on every OS developers use (no database needed). The integration suites
  # above need a PostgreSQL service container, which only Linux runners provide.
  unit-cross-os:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: server
        shell: bash
    env:
      SYNTHAEA_ROOT: ${{ github.workspace }}
      SYNTHAEA_REQUIRE_SIBLINGS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: server
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: synthaea-lab/agent
          path: agent
          persist-credentials: false
          # Everything the agent publishes for other repos to test against.
          sparse-checkout: |
            /apps/agent/src/sink/mod.rs
            /crates/*/tests/fixtures/
            /crates/*/data/
          sparse-checkout-cone-mode: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: synthaea-lab/ml
          path: ml
          persist-credentials: false
          sparse-checkout: tests/fixtures
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: synthaea-lab/rules
          path: rules
          persist-credentials: false
      # Node 20: what server/Dockerfile ships.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: install
        run: npm ci
      - name: prisma client
        run: npx prisma generate
      - name: unit tests
        run: npx vitest run tests/unit
